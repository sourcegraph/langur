# Create a workflow for running `bazel test`
name: CI
on:
  push:
    branches:
    - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - uses: bazelbuild/setup-bazelisk@95c9bf48d0c570bb3e28e57108f3450cd67c1a44 # v2.0.0
    - name: Mount bazel cache  # Optional
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: "~/.cache/bazel"
        key: ${{ runner.os }}-${{ hashFiles('Cargo.Bazel.lock') }}-bazel
    - name: 'Check codegen'
      run: |
        bazel run //tools/codegen
        if ! git diff --quiet; then
          git diff
          echo ""
          echo "-------------------------------------------"
          echo "Re-run 'bazel run //tools/codegen' and push"
          echo "-------------------------------------------"
          exit 1
        fi
    - name: 'Run tests'
      run: bazel test //... --test_output=all --verbose_failures

  cargo_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      # Keep version in sync with WORKSPACE file
    - uses: dtolnay/rust-toolchain@2d1f20b2ad675ea983a83d9ff0af78ccc46ebf22 # 1.68.0
    - name: Cargo cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: "target"
        key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-cargo
    - name: 'Build'
      run: cargo build --workspace
